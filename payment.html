<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment | FreshBasket</title><style>
:root{--green:#2f7d32;--dark:#1f5e24;--border:#e5e7eb;--muted:#6b7280}*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;font-family:Arial,sans-serif;background:#f6f7f6;color:#202124}.header{padding:17px 4%;background:#fff;border-bottom:1px solid var(--border)}.brand{font-size:22px;font-weight:bold;color:var(--dark);text-decoration:none}.brand span{color:#ff7a00}.container{width:min(1050px,92%);margin:34px auto}.back{color:var(--dark);font-weight:bold;text-decoration:none}.banner{display:flex;gap:14px;align-items:center;margin:20px 0 24px;padding:22px;background:var(--dark);color:#fff}.banner h1{margin:0;font-size:23px}.banner p{margin:5px 0 0}.layout{display:grid;grid-template-columns:1fr 1fr;gap:24px}.card{padding:25px;background:#fff;border:1px solid var(--border);border-radius:15px}.card h2{margin-top:0;font-size:20px}.method{display:flex;gap:13px;align-items:center;padding:18px 8px;border-bottom:1px solid var(--border);cursor:pointer}.method input{accent-color:var(--green);width:18px;height:18px}.method strong{display:block}.method small{color:var(--muted)}.row{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border)}.total{font-size:19px;font-weight:bold;border:0}.button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:9px;background:var(--green);color:#fff;font-weight:bold;cursor:pointer;font-size:16px}.success{display:none;margin-top:20px;padding:18px;border-radius:10px;background:#eaf7ea;color:var(--dark);font-weight:bold}.qr-section{display:none;margin-top:20px;padding:20px;background:#f7f9f7;border:1px solid var(--border);border-radius:12px;text-align:center}.qr-section h3{margin:0 0 15px;font-size:17px;color:var(--dark)}.qr-box{display:inline-block;padding:15px;background:#fff;border:1px solid var(--border);border-radius:10px}.qr-box img{display:block;max-width:100%}.qr-amount{margin-top:12px;font-size:15px;color:var(--muted)}.qr-amount strong{color:var(--dark);font-size:18px}.qr-note{margin-top:8px;font-size:12px;color:var(--muted)}@media(max-width:700px){.layout{grid-template-columns:1fr}.container{margin:20px auto}.banner{padding:16px;gap:10px}.banner h1{font-size:19px}.banner p{font-size:12px}.card{padding:18px}.method{padding:15px 8px;gap:10px}.method strong{font-size:14px}.method small{font-size:11px}.row{padding:12px 0;font-size:13px}.total{font-size:16px}.button{padding:15px}.qr-section{padding:16px}.qr-box{padding:10px}.qr-box img{width:150px;height:150px}}
</style></head><body><header class="header"><a class="brand" href="index.html">Fresh<span>Basket</span></a></header><main class="container"><a class="back" href="checkout.html">← Back to Checkout</a><section class="banner"><div>💳</div><div><h1>Payment Options</h1><p>Pay securely using your preferred payment mode</p></div></section><div class="layout"><section class="card"><h2>Select payment method</h2><label class="method"><input type="radio" name="method" value="UPI" onchange="handleMethodChange()"><span><strong>UPI</strong><small>Google Pay, PhonePe, Paytm</small></span></label><label class="method"><input type="radio" name="method" value="UPI QR" onchange="handleMethodChange()"><span><strong>Pay using UPI QR</strong><small>Scan QR code with any UPI app</small></span></label><label class="method"><input type="radio" name="method" value="Credit / Debit Card" onchange="handleMethodChange()"><span><strong>Credit / Debit Card</strong><small>Visa, Mastercard, RuPay</small></span></label><label class="method"><input type="radio" name="method" value="Net Banking" onchange="handleMethodChange()"><span><strong>Net Banking</strong><small>Pay using your bank account</small></span></label><label class="method"><input type="radio" name="method" value="Cash on Delivery" onchange="handleMethodChange()"><span><strong>Cash on Delivery</strong><small>Pay when your order arrives</small></span></label><div id="qrSection" class="qr-section"><h3>Scan QR Code to Pay</h3><div class="qr-box"><div id="qrcode"></div></div><div class="qr-amount">Amount: <strong id="qrAmount">₹0</strong></div><div class="qr-note">Scan with any UPI app (Google Pay, PhonePe, Paytm)</div></div></section><aside class="card"><h2>Order Summary</h2><div id="items"></div><div class="row"><span>Basket value</span><strong id="basket"></strong></div><div class="row"><span>Delivery charge</span><strong id="delivery"></strong></div><div class="row total"><span>Total amount payable</span><span id="total"></span></div><button class="button" onclick="payNow()">Place Order</button><div id="success" class="success"></div></aside></div></main><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
const cart=JSON.parse(localStorage.getItem('freshCart'))||[];const checkout=JSON.parse(localStorage.getItem('freshCheckout'))||{};const subtotal=cart.reduce((sum,item)=>sum+item.price*item.quantity,0);const delivery=subtotal>=299?0:40;const totalAmount=subtotal+delivery;items.innerHTML=cart.map(item=>`<div class="row"><span>${item.name} × ${item.quantity}</span><strong>₹${item.price*item.quantity}</strong></div>`).join('')||'<p>No items in cart.</p>';basket.textContent='₹'+subtotal;document.getElementById('delivery').textContent=delivery?'₹'+delivery:'FREE';total.textContent='₹'+totalAmount;document.getElementById('qrAmount').textContent='₹'+totalAmount;function handleMethodChange(){const method=document.querySelector('input[name="method"]:checked');const qrSection=document.getElementById('qrSection');if(method&&method.value==='UPI QR'){qrSection.style.display='block';generateQRCode()}else{qrSection.style.display='none'}}function generateQRCode(){const qrContainer=document.getElementById('qrcode');qrContainer.innerHTML='';const upiUrl='upi://pay?pa=test@upi&pn=FreshBasket&am='+totalAmount+'&cu=INR';new QRCode(qrContainer,{text:upiUrl,width:180,height:180});}function payNow(){const method=document.querySelector('input[name="method"]:checked');if(!cart.length){alert('Your cart is empty.');return}if(!method){alert('Please select a payment method.');return}if(!checkout.name||!checkout.mobile||!checkout.email){alert('Please complete your customer information.');window.location.href='checkout.html';return}if(!/^[6-9]\d{9}$/.test(checkout.mobile)){alert('Please enter a valid 10-digit mobile number.');window.location.href='checkout.html';return}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(checkout.email)){alert('Please enter a valid email address.');window.location.href='checkout.html';return}const orderId='ORD-'+Date.now();const orders=JSON.parse(localStorage.getItem('freshOrders'))||[];orders.unshift({id:orderId,customer:checkout.name,mobile:checkout.mobile,email:checkout.email,items:cart,total:totalAmount,payment:method.value,status:'Order Confirmed',date:new Date().toLocaleString()});localStorage.setItem('freshOrders',JSON.stringify(orders));localStorage.setItem('freshCart','[]');document.getElementById('success').style.display='block';document.getElementById('success').textContent='✓ Order placed successfully! Order ID: '+orderId+'. Redirecting to home...';document.querySelector('.button').disabled=true;document.querySelector('.button').textContent='Order Placed';setTimeout(()=>{window.location.href='index.html'},2000)}
</script></body></html>
