<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment | FreshBasket</title><style>
:root{--green:#2f7d32;--dark:#1f5e24;--border:#e5e7eb;--muted:#6b7280}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f7f6;color:#202124}.header{padding:17px 4%;background:#fff;border-bottom:1px solid var(--border)}.brand{font-size:22px;font-weight:bold;color:var(--dark);text-decoration:none}.brand span{color:#ff7a00}.container{width:min(1050px,92%);margin:34px auto}.back{color:var(--dark);font-weight:bold;text-decoration:none}.banner{display:flex;gap:14px;align-items:center;margin:20px 0 24px;padding:22px;background:var(--dark);color:#fff}.banner h1{margin:0;font-size:23px}.banner p{margin:5px 0 0}.layout{display:grid;grid-template-columns:1fr 1fr;gap:24px}.card{padding:25px;background:#fff;border:1px solid var(--border);border-radius:15px}.card h2{margin-top:0;font-size:20px}.method{display:flex;gap:13px;align-items:center;padding:18px 8px;border-bottom:1px solid var(--border);cursor:pointer}.method input{accent-color:var(--green)}.method strong{display:block}.method small{color:var(--muted)}.row{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border)}.total{font-size:19px;font-weight:bold;border:0}.button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:9px;background:var(--green);color:#fff;font-weight:bold;cursor:pointer}.success{display:none;margin-top:20px;padding:18px;border-radius:10px;background:#eaf7ea;color:var(--dark);font-weight:bold}@media(max-width:700px){.layout{grid-template-columns:1fr}}
</style></head><body><header class="header"><a class="brand" href="index.html">Fresh<span>Basket</span></a></header><main class="container"><a class="back" href="checkout.html">← Back to Checkout</a><section class="banner"><div>💳</div><div><h1>Payment Options</h1><p>Pay securely using your preferred payment mode</p></div></section><div class="layout"><section class="card"><h2>Select payment method</h2><label class="method"><input type="radio" name="method" value="UPI"><span><strong>UPI</strong><small>Google Pay, PhonePe, Paytm</small></span></label><label class="method"><input type="radio" name="method" value="Credit / Debit Card"><span><strong>Credit / Debit Card</strong><small>Visa, Mastercard, RuPay</small></span></label><label class="method"><input type="radio" name="method" value="Net Banking"><span><strong>Net Banking</strong><small>Pay using your bank account</small></span></label><label class="method"><input type="radio" name="method" value="Cash on Delivery"><span><strong>Cash on Delivery</strong><small>Pay when your order arrives</small></span></label></section><aside class="card"><h2>Order Summary</h2><div id="items"></div><div class="row"><span>Basket value</span><strong id="basket"></strong></div><div class="row"><span>Delivery charge</span><strong id="delivery"></strong></div><div class="row total"><span>Total amount payable</span><span id="total"></span></div><button class="button" onclick="payNow()">Place Order</button><div id="success" class="success"></div></aside></div></main><script>
const cart=JSON.parse(localStorage.getItem('freshCart'))||[];const checkout=JSON.parse(localStorage.getItem('freshCheckout'))||{};const subtotal=cart.reduce((sum,item)=>sum+item.price*item.quantity,0);const delivery=subtotal>=299?0:40;items.innerHTML=cart.map(item=>`<div class="row"><span>${item.name} × ${item.quantity}</span><strong>₹${item.price*item.quantity}</strong></div>`).join('')||'<p>No items in cart.</p>';basket.textContent='₹'+subtotal;document.getElementById('delivery').textContent=delivery?'₹'+delivery:'FREE';total.textContent='₹'+(subtotal+delivery);function payNow(){const method=document.querySelector('input[name="method"]:checked');if(!cart.length){alert('Your cart is empty.');return}if(!method){alert('Please select a payment method.');return}if(!checkout.name||!checkout.mobile||!checkout.email){alert('Please complete your customer information.');window.location.href='checkout.html';return}if(!/^[6-9]\d{9}$/.test(checkout.mobile)){alert('Please enter a valid 10-digit mobile number.');window.location.href='checkout.html';return}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(checkout.email)){alert('Please enter a valid email address.');window.location.href='checkout.html';return}const orderId='ORD-'+Date.now();const orders=JSON.parse(localStorage.getItem('freshOrders'))||[];orders.unshift({id:orderId,customer:checkout.name,mobile:checkout.mobile,email:checkout.email,items:cart,total:subtotal+delivery,payment:method.value,status:'Order Confirmed',date:new Date().toLocaleString()});localStorage.setItem('freshOrders',JSON.stringify(orders));localStorage.setItem('freshCart','[]');document.getElementById('success').style.display='block';document.getElementById('success').textContent='✓ Order placed successfully! Order ID: '+orderId+'. Redirecting to home...';document.querySelector('.button').disabled=true;document.querySelector('.button').textContent='Order Placed';setTimeout(()=>{window.location.href='index.html'},2000)}
</script></body></html>
