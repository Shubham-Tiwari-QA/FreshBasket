<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | FreshBasket</title><style>
:root{--green:#2f7d32;--dark:#1f5e24;--border:#e5e7eb;--muted:#6b7280}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f7f6;color:#202124}.header{padding:17px 4%;background:#fff;border-bottom:1px solid var(--border)}.brand{font-size:22px;font-weight:bold;color:var(--dark);text-decoration:none}.brand span{color:#ff7a00}.container{width:min(1050px,92%);margin:34px auto}.back{color:var(--dark);font-weight:bold;text-decoration:none}.title{margin:20px 0}.layout{display:grid;grid-template-columns:1.25fr .75fr;gap:22px}.card{padding:25px;background:#fff;border:1px solid var(--border);border-radius:15px}.card h2{margin-top:0;font-size:20px}.field{margin:15px 0}.field label{display:block;margin-bottom:7px;font-size:14px;font-weight:bold}.field input{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;font:inherit}.error{color:#dc2626;font-size:13px;margin-top:6px;display:none}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}.total{font-size:18px;font-weight:bold;border:0}.button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:9px;background:var(--green);color:#fff;font-weight:bold;cursor:pointer}.empty{color:var(--muted)}@media(max-width:700px){.layout{grid-template-columns:1fr}}
</style></head><body><header class="header"><a class="brand" href="index.html">Fresh<span>Basket</span></a></header><main class="container"><a class="back" href="index.html#products">← Continue shopping</a><h1 class="title">Checkout</h1><div class="layout"><section class="card"><h2>Customer Information</h2><div class="field"><label>Full Name</label><input id="name" placeholder="Enter your full name"><div id="nameError" class="error">Please enter your full name.</div></div><div class="field"><label>Mobile Number</label><input id="mobile" type="tel" maxlength="10" placeholder="Enter your 10-digit mobile number" inputmode="numeric"><div id="mobileError" class="error">Please enter a valid 10-digit mobile number.</div></div><div class="field"><label>Email Address</label><input id="email" type="email" placeholder="you@example.com"><div id="emailError" class="error">Please enter a valid email address.</div></div><button class="button" onclick="continueToPayment()">Continue to Payment</button></section><aside class="card"><h2>Order summary</h2><div id="items"></div><div class="row"><span>Delivery</span><strong id="delivery"></strong></div><div class="row total"><span>Total</span><span id="total"></span></div></aside></div></main><script>
const cart=JSON.parse(localStorage.getItem('freshCart'))||[];const subtotal=cart.reduce((sum,item)=>sum+item.price*item.quantity,0);const delivery=subtotal>=299?0:40;document.getElementById('items').innerHTML=cart.length?cart.map(item=>`<div class="row"><span>${item.name} × ${item.quantity}</span><strong>₹${item.price*item.quantity}</strong></div>`).join(''):'<p class="empty">Your cart is empty.</p>';document.getElementById('delivery').textContent=delivery?'₹'+delivery:'FREE';document.getElementById('total').textContent='₹'+(subtotal+delivery);function continueToPayment(){const name=document.getElementById('name').value.trim();const mobile=document.getElementById('mobile').value.trim();const email=document.getElementById('email').value.trim();const nameError=document.getElementById('nameError');const mobileError=document.getElementById('mobileError');const emailError=document.getElementById('emailError');if(!cart.length){alert('Your cart is empty.');return}let valid=true;if(!name){nameError.style.display='block';valid=false}else{nameError.style.display='none'}if(!/^[6-9]\d{9}$/.test(mobile)){mobileError.style.display='block';valid=false}else{mobileError.style.display='none'}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){emailError.style.display='block';valid=false}else{emailError.style.display='none'}if(!valid)return;localStorage.setItem('freshCheckout',JSON.stringify({name:name,mobile:mobile,email:email}));window.location.href='payment.html'}
</script></body></html>
