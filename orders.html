<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Orders | FreshBasket</title><style>
:root{--green:#2f7d32;--dark:#1f5e24;--border:#e5e7eb;--muted:#6b7280}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f7f6;color:#202124}.header{padding:17px 4%;background:#fff;border-bottom:1px solid var(--border)}.brand{color:var(--dark);font-size:22px;font-weight:bold;text-decoration:none}.brand span{color:#ff7a00}.container{width:min(900px,92%);margin:34px auto}.back{color:var(--dark);font-weight:bold;text-decoration:none}.heading{margin:22px 0 5px}.sub{margin:0 0 22px;color:var(--muted)}.order{margin:15px 0;padding:22px;background:#fff;border:1px solid var(--border);border-radius:14px}.top{display:flex;justify-content:space-between;gap:16px}.id{margin:0;font-size:18px}.date{margin:6px 0 0;color:var(--muted);font-size:13px}.status{padding:7px 10px;height:max-content;border-radius:20px;background:#eaf7ea;color:var(--green);font-size:12px;font-weight:bold}.items{margin:18px 0 5px;border-top:1px solid var(--border)}.item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}.total{display:flex;justify-content:space-between;margin-top:18px;font-size:17px}.payment{margin-top:10px;color:var(--muted);font-size:14px}.customer{margin-top:12px;padding:12px;background:#f7f9f7;border-radius:8px;font-size:14px;line-height:1.8}.customer strong{color:var(--dark)}.empty{padding:38px;text-align:center;background:#fff;border:1px solid var(--border);border-radius:14px;color:var(--muted)}
</style></head><body><header class="header"><a class="brand" href="index.html">Fresh<span>Basket</span></a></header><main class="container"><a class="back" href="index.html">← Back to Home</a><h1 class="heading">My Orders</h1><p class="sub">Track and manage your orders.</p><div id="orderList"></div></main><script>
const orders=JSON.parse(localStorage.getItem('freshOrders'))||[];const list=document.getElementById('orderList');list.innerHTML=orders.length?orders.map(order=>`<article class="order"><div class="top"><div><h2 class="id">${order.id}</h2><p class="date">${order.date||''}</p></div><span class="status">${order.status||'Order Confirmed'}</span></div><div class="customer"><div><strong>Customer:</strong> ${order.customer||'—'}</div><div><strong>Mobile:</strong> ${order.mobile||'—'}</div><div><strong>Email:</strong> ${order.email||'—'}</div></div><div class="items">${(order.items||[]).map(item=>`<div class="item"><span>${item.name} × ${item.quantity}</span><strong>₹${item.price*item.quantity}</strong></div>`).join('')}</div><div class="total"><strong>Total paid</strong><strong>₹${order.total}</strong></div><div class="payment">Payment method: ${order.payment||order.paymentMethod||'—'}</div></article>`).join(''):'<div class="empty"><h2>No orders placed yet</h2><p>Your completed orders will appear here.</p></div>';
</script></body></html>
