<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Orders | FreshBasket</title><style>
:root{--green:#2f7d32;--dark:#1f5e24;--border:#e5e7eb;--muted:#6b7280}*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;font-family:Arial,sans-serif;background:#f6f7f6;color:#202124}.header{padding:17px 4%;background:#fff;border-bottom:1px solid var(--border)}.brand{color:var(--dark);font-size:22px;font-weight:bold;text-decoration:none}.brand span{color:#ff7a00}.container{width:min(900px,92%);margin:34px auto}.back{color:var(--dark);font-weight:bold;text-decoration:none}.heading{margin:22px 0 5px}.sub{margin:0 0 22px;color:var(--muted)}.order{margin:15px 0;padding:22px;background:#fff;border:1px solid var(--border);border-radius:14px}.top{display:flex;justify-content:space-between;gap:16px}.id{margin:0;font-size:18px}.date{margin:6px 0 0;color:var(--muted);font-size:13px}.status{padding:7px 10px;height:max-content;border-radius:20px;background:#eaf7ea;color:var(--green);font-size:12px;font-weight:bold}.items{margin:18px 0 5px;border-top:1px solid var(--border)}.item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}.total{display:flex;justify-content:space-between;margin-top:18px;font-size:17px}.payment{margin-top:10px;color:var(--muted);font-size:14px}.customer{margin-top:12px;padding:12px;background:#f7f9f7;border-radius:8px;font-size:14px;line-height:1.8}.customer strong{color:var(--dark)}.actions{margin-top:16px}.track-btn{display:inline-block;padding:12px 20px;border-radius:9px;background:var(--green);color:#fff;font-weight:bold;text-decoration:none;font-size:14px}.track-btn:hover{background:var(--dark)}.empty{padding:38px;text-align:center;background:#fff;border:1px solid var(--border);border-radius:14px;color:var(--muted)}@media(max-width:700px){.container{margin:20px auto}.heading{font-size:24px}.order{padding:16px}.top{flex-direction:column;gap:10px}.status{align-self:flex-start}.id{font-size:16px}.date{font-size:12px}.item{font-size:13px;padding:10px 0}.total{font-size:15px}.payment{font-size:13px}.customer{font-size:13px;padding:10px}.track-btn{width:100%;text-align:center;padding:13px}.empty{padding:28px}}
</style></head><body><header class="header"><a class="brand" href="index.html">Fresh<span>Basket</span></a></header><main class="container"><a class="back" href="index.html">← Back to Home</a><h1 class="heading">My Orders</h1><p class="sub">Track and manage your orders.</p><div id="orderList"></div></main><script>
const esc1=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money1=n=>'₹'+Number(n||0).toLocaleString('en-IN');const orders=JSON.parse(localStorage.getItem('freshOrders'))||[];const list=document.getElementById('orderList');list.innerHTML=orders.length?orders.map(order=>`<article class="order"><div class="top"><div><h2 class="id">${esc1(order.id)}</h2><p class="date">${esc1(order.date||'')}</p></div><span class="status">${esc1(order.status||'Order Confirmed')}</span></div><div class="customer"><div><strong>Customer:</strong> ${esc1(order.customer||'—')}</div><div><strong>Mobile:</strong> ${esc1(order.mobile||'—')}</div><div><strong>Email:</strong> ${esc1(order.email||'—')}</div></div><div class="items">${(order.items||[]).map(item=>`<div class="item"><span>${esc1(item.name)} × ${item.quantity}</span><strong>${money1(item.price*item.quantity)}</strong></div>`).join('')}</div><div class="total"><strong>Total paid</strong><strong>${money1(order.total)}</strong></div><div class="payment">Payment method: ${esc1(order.payment||order.paymentMethod||'—')}</div><div class="actions"><a class="track-btn" href="track-order.html?orderId=${encodeURIComponent(order.id)}">📍 Track Order</a></div></article>`).join(''):'<div class="empty"><h2>No orders placed yet</h2><p>Your completed orders will appear here.</p></div>';
</script></body></html>
