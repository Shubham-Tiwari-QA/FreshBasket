<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Product Details | FreshBasket</title>
    <style>
      :root{--green:#2f7d32;--dark:#1f5e24;--border:#e5e7eb;--muted:#6b7280;--orange:#ff7a00}*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;font-family:Arial,sans-serif;background:#f6f7f6;color:#202124}.header{background:#fff;border-bottom:1px solid var(--border);padding:17px 4%;display:flex;justify-content:space-between;align-items:center}.brand{color:var(--dark);font-size:22px;font-weight:bold;text-decoration:none}.brand span{color:#ff7a00}.container{width:min(1060px,92%);margin:34px auto}.back{display:inline-block;margin-bottom:18px;color:var(--dark);font-weight:bold;text-decoration:none}.card{display:grid;grid-template-columns:minmax(280px,.9fr) minmax(0,1.1fr);gap:38px;padding:30px;background:#fff;border:1px solid var(--border);border-radius:18px}.image{width:100%;height:380px;object-fit:contain;background:#f4f8f4;border-radius:13px;padding:18px}.category{color:var(--green);font-size:13px;font-weight:bold}.name{margin:8px 0 12px;font-size:34px}.rating{color:#e58b00}.price{display:inline-block;margin:23px 10px 16px 0;color:var(--green);font-size:29px;font-weight:bold}.mrp{color:#888;text-decoration:line-through}.desc{color:var(--muted);line-height:1.65}.stock{display:inline-block;margin:17px 0;padding:7px 10px;background:#eaf7ea;color:var(--green);border-radius:20px;font-size:13px;font-weight:bold}.actions{display:flex;gap:14px;align-items:center}.quantity{display:flex;align-items:center;gap:13px;padding:5px;border:1px solid var(--border);border-radius:9px}.quantity button{width:30px;height:30px;border:0;border-radius:6px;background:#eef8ee;color:var(--dark);font-size:18px;cursor:pointer}.add{padding:14px 27px;border:0;border-radius:9px;background:var(--green);color:#fff;font-weight:bold;cursor:pointer;font-size:16px}.promise{margin-top:20px;padding:14px;border-radius:9px;background:#f5faf5;color:var(--dark);font-size:14px}.info{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}.info div{padding:12px;border:1px solid var(--border);border-radius:9px}.info span{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.wishlist-detail-btn{position:absolute;top:15px;right:15px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.9);border:1px solid var(--border);color:#999;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;transition:.2s}.wishlist-detail-btn:hover{background:#fff;color:#e53935;transform:scale(1.1)}.wishlist-detail-btn.active{color:#e53935}.wishlist-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1999}.wishlist-panel{position:fixed;right:-430px;top:0;width:430px;max-width:100%;height:100vh;background:#fff;z-index:2000;transition:.35s;display:flex;flex-direction:column}.wishlist-panel.active{right:0}.wishlist-header{padding:22px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}.wishlist-header h2{font-size:20px;font-weight:700}.wishlist-items{flex:1;overflow-y:auto;padding:20px}.wishlist-item{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid var(--border);gap:12px}.wishlist-item-left{display:flex;gap:12px;align-items:center;flex:1}.wishlist-item-icon{width:55px;height:55px;display:flex;justify-content:center;align-items:center;background:#f3f6f3;border-radius:10px;font-size:30px}.wishlist-item-name{font-weight:bold;font-size:14px}.wishlist-item-price{color:var(--muted);font-size:13px;margin-top:4px}.wishlist-item-actions{display:flex;gap:8px}.wishlist-move-btn{padding:8px 14px;background:var(--green);color:#fff;border-radius:7px;font-size:13px;font-weight:600}.wishlist-remove-btn{padding:8px 14px;background:#f5f5f5;color:var(--dark);border:1px solid var(--border);border-radius:7px;font-size:13px}.wishlist-remove-btn:hover{background:#e5e5e5}.wishlist-empty{text-align:center;padding:40px 20px;color:var(--muted)}.wishlist-empty-icon{font-size:50px;margin-bottom:15px}.toast{position:fixed;bottom:25px;right:25px;background:#202124;color:#fff;padding:16px 22px;border-radius:10px;z-index:5000}.toast.hidden{display:none!important}@media(max-width:700px){.container{margin:20px auto}.card{grid-template-columns:1fr;padding:18px;gap:18px}.image{height:240px;padding:12px}.name{font-size:24px}.price{font-size:24px}.actions{align-items:stretch;flex-direction:column}.quantity{justify-content:center}.quantity button{width:36px;height:36px}.add{width:100%;padding:15px}.info{grid-template-columns:1fr}.promise{font-size:13px;padding:12px}.wishlist-panel{width:100%;right:-100%}}
    .hidden{display:none!important}</style>
</head>
<body>
  <header class="header"><a class="brand" href="index.html">Fresh<span>Basket</span></a><button class="wishlist-header-btn" onclick="openWishlist()" style="background:transparent;border:0;color:var(--dark);font-size:22px;cursor:pointer;position:relative;"><span id="wishlistCount" class="wishlist-count" style="position:absolute;top:-6px;right:-8px;background:var(--orange);color:#fff;border-radius:50%;width:18px;height:18px;font-size:11px;display:flex;align-items:center;justify-content:center;">0</span>♡</button></header>
  <main class="container">
    <a class="back" href="index.html#products">← Back to Products</a>
    <section class="card">
      <img id="image" class="image" alt="">
      <button id="wishlistBtn" class="wishlist-detail-btn" onclick="toggleWishlist()" title="Add to Wishlist">♡</button>
      <div>
        <div id="category" class="category"></div><h1 id="name" class="name"></h1>
        <div class="rating">★ <span id="rating"></span> <span id="reviews"></span></div>
        <span id="price" class="price"></span><span id="mrp" class="mrp"></span>
        <p id="description" class="desc"></p><span id="stock" class="stock"></span>
        <div class="actions"><div class="quantity"><button onclick="changeQuantity(-1)">−</button><strong id="quantity">1</strong><button onclick="changeQuantity(1)">+</button></div><button class="add" onclick="addToCart()">Add to Cart</button></div>
        <div class="promise">⚡ Free delivery on orders above ₹299 · Freshness guaranteed</div>
        <div class="info"><div><span>Weight</span><strong>1 Kg</strong></div><div><span>Country of origin</span><strong>India</strong></div><div><span>Shelf life</span><strong>5-7 Days</strong></div></div>
      </div>
    </section>
  </main>
  <script>
    const products=[
      {id:1,name:'Fresh Red Apples',category:'Fruits',price:120,mrp:150,rating:4.5,image:'https://www.bbassets.com/media/uploads/p/m/40033819_36-fresho-apple-shimla.jpg?tr=w-500,q-80',description:'Fresh, juicy and premium quality red apples.'},
      {id:2,name:'Organic Bananas',category:'Fruits',price:55,mrp:70,rating:4.7,image:'https://www.bbassets.com/media/uploads/p/m/10000025_32-fresho-banana-robusta.jpg?tr=w-500,q-80',description:'Naturally sweet, ripe bananas selected for everyday freshness.'},
      {id:3,name:'Fresh Oranges',category:'Fruits',price:90,mrp:110,rating:4.3,image:'https://www.bbassets.com/media/uploads/p/m/20003956_6-fresho-baby-orange.jpg?tr=w-500,q-80',description:'Juicy, citrusy oranges with a bright, refreshing flavour.'}
    ];
    const savedProduct=JSON.parse(localStorage.getItem('freshSelectedProduct')||'null');
    const product=savedProduct || products.find(item=>item.id===Number(new URLSearchParams(location.search).get('id'))) || products[0]; let quantity=1;
    image.src=product.image;image.alt=product.name;category.textContent=product.category;name.textContent=product.name;rating.textContent=product.rating;reviews.textContent='(120 reviews)';price.textContent='₹'+product.price;mrp.textContent='₹'+product.mrp;description.textContent=product.description;stock.textContent='In stock · 20 available';
    function changeQuantity(change){quantity=Math.max(1,Math.min(20,quantity+change));document.getElementById('quantity').textContent=quantity}
    function addToCart(){const cart=JSON.parse(localStorage.getItem('freshCart'))||[];const existing=cart.find(item=>item.id===product.id);if(existing)existing.quantity+=quantity;else cart.push({...product,quantity});localStorage.setItem('freshCart',JSON.stringify(cart));window.location.href='checkout.html'}

    /* =========================
       WISHLIST
    ========================= */

    let wishlist = JSON.parse(localStorage.getItem('freshWishlist')) || [];

    function isInWishlist(id) {
        return wishlist.some(item => item.id === id);
    }

    function updateWishlistBtn() {
        const btn = document.getElementById('wishlistBtn');
        if (!btn) return;
        if (isInWishlist(product.id)) {
            btn.classList.add('active');
            btn.textContent = '❤';
            btn.title = 'Remove from Wishlist';
        } else {
            btn.classList.remove('active');
            btn.textContent = '♡';
            btn.title = 'Add to Wishlist';
        }
    }

    function toggleWishlist() {
        if (isInWishlist(product.id)) {
            removeFromWishlist(product.id);
        } else {
            addToWishlist(product.id);
        }
    }

    function addToWishlist(id) {
        const prod = products.find(item => item.id === id);
        if (!prod) return;
        if (isInWishlist(id)) return;
        wishlist.push({ ...prod });
        saveWishlist();
        renderWishlist();
        updateWishlistBtn();
        showToast(prod.name + ' added to wishlist');
    }

    function removeFromWishlist(id) {
        const prod = products.find(item => item.id === id);
        wishlist = wishlist.filter(item => item.id !== id);
        saveWishlist();
        renderWishlist();
        updateWishlistBtn();
        showToast(prod ? prod.name + ' removed from wishlist' : 'Removed from wishlist');
    }

    function moveToCart(id) {
        const prod = products.find(item => item.id === id);
        const cart = JSON.parse(localStorage.getItem('freshCart')) || [];
        const existing = cart.find(item => item.id === id);
        if (existing) {
            existing.quantity++;
        } else {
            cart.push({ ...prod, quantity: 1 });
        }
        localStorage.setItem('freshCart', JSON.stringify(cart));
        removeFromWishlist(id);
        showToast(prod.name + ' moved to cart');
    }

    function saveWishlist() {
        localStorage.setItem('freshWishlist', JSON.stringify(wishlist));
    }

    function renderWishlist() {
        const container = document.getElementById('wishlistItems');
        const countEl = document.getElementById('wishlistCount');
        if (countEl) countEl.textContent = wishlist.length;
        if (!container) return;
        if (wishlist.length === 0) {
            container.innerHTML = '<div class="wishlist-empty"><div class="wishlist-empty-icon">♡</div><p>Your wishlist is empty.</p></div>';
            return;
        }
        container.innerHTML = '';
        wishlist.forEach(item => {
            container.innerHTML += '<div class="wishlist-item"><div class="wishlist-item-left"><div class="wishlist-item-icon">' + item.image + '</div><div><div class="wishlist-item-name">' + item.name + '</div><div class="wishlist-item-price">₹' + item.price + '</div></div></div><div class="wishlist-item-actions"><button class="wishlist-move-btn" onclick="moveToCart(' + item.id + ')">Move to Cart</button><button class="wishlist-remove-btn" onclick="removeFromWishlist(' + item.id + ')">Remove</button></div></div>';
        });
    }

    function openWishlist() {
        const panel = document.getElementById('wishlistPanel');
        const overlay = document.getElementById('wishlistOverlay');
        if (panel) panel.classList.add('active');
        if (overlay) overlay.classList.remove('hidden');
    }

    function closeWishlist() {
        const panel = document.getElementById('wishlistPanel');
        const overlay = document.getElementById('wishlistOverlay');
        if (panel) panel.classList.remove('active');
        if (overlay) overlay.classList.add('hidden');
    }

    function showToast(message) {
        let toast = document.getElementById('toast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'toast';
            toast.className = 'toast';
            document.body.appendChild(toast);
        }
        toast.textContent = message;
        toast.classList.remove('hidden');
        setTimeout(() => { toast.classList.add('hidden'); }, 2500);
    }

    /* =========================
       INITIAL LOAD
    ========================= */

    updateWishlistBtn();
    renderWishlist();
  </script>

  <!-- =========================
       WISHLIST PANEL
  ========================= -->

  <div id="wishlistOverlay" class="wishlist-overlay hidden" onclick="closeWishlist()"></div>

  <aside id="wishlistPanel" class="wishlist-panel">
    <div class="wishlist-header">
      <h2>Your Wishlist</h2>
      <button class="wishlist-close-btn" onclick="closeWishlist()" style="width:35px;height:35px;border-radius:50%;background:transparent;border:1px solid var(--border);font-size:20px;cursor:pointer;">×</button>
    </div>
    <div id="wishlistItems" class="wishlist-items"></div>
  </aside>

  <!-- TOAST -->
  <div id="toast" class="toast hidden"></div>
</body>
</html>
