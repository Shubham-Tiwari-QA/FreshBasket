<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Product Details | FreshBasket</title>
  <style>
    :root{--green:#2f7d32;--dark:#1f5e24;--border:#e5e7eb;--muted:#6b7280}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f7f6;color:#202124}.header{background:#fff;border-bottom:1px solid var(--border);padding:17px 4%}.brand{color:var(--dark);font-size:22px;font-weight:bold;text-decoration:none}.brand span{color:#ff7a00}.container{width:min(1060px,92%);margin:34px auto}.back{display:inline-block;margin-bottom:18px;color:var(--dark);font-weight:bold;text-decoration:none}.card{display:grid;grid-template-columns:minmax(280px,.9fr) minmax(0,1.1fr);gap:38px;padding:30px;background:#fff;border:1px solid var(--border);border-radius:18px}.image{width:100%;height:380px;object-fit:contain;background:#f4f8f4;border-radius:13px;padding:18px}.category{color:var(--green);font-size:13px;font-weight:bold}.name{margin:8px 0 12px;font-size:34px}.rating{color:#e58b00}.price{display:inline-block;margin:23px 10px 16px 0;color:var(--green);font-size:29px;font-weight:bold}.mrp{color:#888;text-decoration:line-through}.desc{color:var(--muted);line-height:1.65}.stock{display:inline-block;margin:17px 0;padding:7px 10px;background:#eaf7ea;color:var(--green);border-radius:20px;font-size:13px;font-weight:bold}.actions{display:flex;gap:14px;align-items:center}.quantity{display:flex;align-items:center;gap:13px;padding:5px;border:1px solid var(--border);border-radius:9px}.quantity button{width:30px;height:30px;border:0;border-radius:6px;background:#eef8ee;color:var(--dark);font-size:18px;cursor:pointer}.add{padding:14px 27px;border:0;border-radius:9px;background:var(--green);color:#fff;font-weight:bold;cursor:pointer}.promise{margin-top:20px;padding:14px;border-radius:9px;background:#f5faf5;color:var(--dark);font-size:14px}.info{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}.info div{padding:12px;border:1px solid var(--border);border-radius:9px}.info span{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}@media(max-width:700px){.card{grid-template-columns:1fr;padding:20px;gap:22px}.image{height:260px}.info{grid-template-columns:1fr}.actions{align-items:stretch;flex-direction:column}}
  </style>
</head>
<body>
  <header class="header"><a class="brand" href="index.html">Fresh<span>Basket</span></a></header>
  <main class="container">
    <a class="back" href="index.html#products">← Back to Products</a>
    <section class="card">
      <img id="image" class="image" alt="">
      <div>
        <div id="category" class="category"></div><h1 id="name" class="name"></h1>
        <div class="rating">★ <span id="rating"></span> <span id="reviews"></span></div>
        <span id="price" class="price"></span><span id="mrp" class="mrp"></span>
        <p id="description" class="desc"></p><span id="stock" class="stock"></span>
        <div class="actions"><div class="quantity"><button onclick="changeQuantity(-1)">−</button><strong id="quantity">1</strong><button onclick="changeQuantity(1)">+</button></div><button class="add" onclick="addToCart()">Add to Cart</button></div>
        <div class="promise">⚡ Free delivery on orders above ₹299 · Freshness guaranteed</div>
        <div class="info"><div><span>Weight</span><strong>1 Kg</strong></div><div><span>Country of origin</span><strong>India</strong></div><div><span>Shelf life</span><strong>5-7 Days</strong></div></div>
      </div>
    </section>
  </main>
  <script>
    const products=[
      {id:1,name:'Fresh Red Apples',category:'Fruits',price:120,mrp:150,rating:4.5,image:'https://www.bbassets.com/media/uploads/p/m/40033819_36-fresho-apple-shimla.jpg?tr=w-500,q-80',description:'Fresh, juicy and premium quality red apples.'},
      {id:2,name:'Organic Bananas',category:'Fruits',price:55,mrp:70,rating:4.7,image:'https://www.bbassets.com/media/uploads/p/m/10000025_32-fresho-banana-robusta.jpg?tr=w-500,q-80',description:'Naturally sweet, ripe bananas selected for everyday freshness.'},
      {id:3,name:'Fresh Oranges',category:'Fruits',price:90,mrp:110,rating:4.3,image:'https://www.bbassets.com/media/uploads/p/m/20003956_6-fresho-baby-orange.jpg?tr=w-500,q-80',description:'Juicy, citrusy oranges with a bright, refreshing flavour.'}
    ];
    const savedProduct=JSON.parse(localStorage.getItem('freshSelectedProduct')||'null');
    const product=savedProduct || products.find(item=>item.id===Number(new URLSearchParams(location.search).get('id'))) || products[0]; let quantity=1;
    image.src=product.image;image.alt=product.name;category.textContent=product.category;name.textContent=product.name;rating.textContent=product.rating;reviews.textContent='(120 reviews)';price.textContent='₹'+product.price;mrp.textContent='₹'+product.mrp;description.textContent=product.description;stock.textContent='In stock · 20 available';
    function changeQuantity(change){quantity=Math.max(1,Math.min(20,quantity+change));document.getElementById('quantity').textContent=quantity}
    function addToCart(){const cart=JSON.parse(localStorage.getItem('freshCart'))||[];const existing=cart.find(item=>item.id===product.id);if(existing)existing.quantity+=quantity;else cart.push({...product,quantity});localStorage.setItem('freshCart',JSON.stringify(cart));window.location.href='checkout.html'}
  </script>
</body>
</html>
